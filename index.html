<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Te amo ❤️">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
  <link rel="icon" type="image/png" href="apple-touch-icon.png?v=1">
  <title>Te amo ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      color: #fff;
      background: linear-gradient(160deg, #2b1055 0%, #7b2ff7 50%, #f72585 100%);
      text-align: center;
    }
    h1 { font-size: 1.6rem; font-weight: 600; }
    .fecha { font-size: 0.95rem; opacity: 0.85; }

    /* Letrero y corazón */
    .zona-corazon { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .letrero {
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 999px;
    }
    .corazon {
      font-size: 3.5rem;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; /* evita el zoom con doble toque en iPhone */
      animation: latido 1.2s infinite;
    }
    .corazon.toque { animation: none; transform: scale(1.4); transition: transform 0.1s; }
    @keyframes latido {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .puntos { display: flex; gap: 6px; height: 10px; }
    .punto { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); }
    .punto.lleno { background: #fff; }

    /* Contador */
    .contador {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 360px;
    }
    .caja {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 20px 10px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .numero { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .etiqueta { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.85; }

    /* Pantalla del día */
    .final { display: none; flex-direction: column; align-items: center; gap: 18px; }
    .final p { font-size: 1.8rem; font-weight: 700; }
    .final img {
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    /* Foto al tocar el corazón */
    .ventana {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      z-index: 10;
    }
    .ventana.visible { display: flex; animation: aparecer 0.4s ease; }
    .ventana img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(247, 37, 133, 0.5);
    }
    .ventana span { font-size: 0.9rem; opacity: 0.8; }
    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="zona-corazon">
    <div class="letrero">Toca tres veces el corazón 💌</div>
    <div class="corazon" id="corazon">❤️</div>
    <div class="puntos">
      <div class="punto" id="p1"></div>
      <div class="punto" id="p2"></div>
      <div class="punto" id="p3"></div>
    </div>
  </div>

  <div id="cuenta">
    <h1>Falta poco para vernos</h1>
    <p class="fecha">26 de diciembre de 2026 · 6:00 a. m.</p>
  </div>

  <div class="contador" id="contador">
    <div class="caja"><div class="numero" id="dias">0</div><div class="etiqueta">Días</div></div>
    <div class="caja"><div class="numero" id="horas">00</div><div class="etiqueta">Horas</div></div>
    <div class="caja"><div class="numero" id="minutos">00</div><div class="etiqueta">Minutos</div></div>
    <div class="caja"><div class="numero" id="segundos">00</div><div class="etiqueta">Segundos</div></div>
  </div>

  <div class="final" id="final">
    <p>¡Llegó el día! 🎉❤️</p>
    <!-- Si no subes final.jpg, usa foto.jpg -->
    <img src="final.jpg" alt="Nosotros" onerror="this.onerror=null; this.src='foto.jpg';">
  </div>

  <div class="ventana" id="ventana">
    <img src="foto.jpg" alt="Nuestra foto">
    <span>Con tigo quiero contruir una vida y un futuro juntos TE AMO ❤️</span>
  </div>

  <script>
    // ---------- Contador ----------
    // Fecha fija en hora de Colombia (UTC-5), así funciona igual en cualquier celular
    const destino = new Date("2026-12-26T06:00:00-05:00").getTime();

    function dosDigitos(n) { return String(n).padStart(2, "0"); }

    function actualizar() {
      const resta = destino - Date.now();

      if (resta <= 0) {
        document.getElementById("contador").style.display = "none";
        document.getElementById("cuenta").style.display = "none";
        document.getElementById("final").style.display = "flex";
        clearInterval(intervalo);
        return;
      }

      const dias = Math.floor(resta / 86400000);
      const horas = Math.floor((resta % 86400000) / 3600000);
      const minutos = Math.floor((resta % 3600000) / 60000);
      const segundos = Math.floor((resta % 60000) / 1000);

      document.getElementById("dias").textContent = dias;
      document.getElementById("horas").textContent = dosDigitos(horas);
      document.getElementById("minutos").textContent = dosDigitos(minutos);
      document.getElementById("segundos").textContent = dosDigitos(segundos);
    }

    const intervalo = setInterval(actualizar, 1000);
    actualizar();

    // ---------- Tres toques al corazón ----------
    const corazon = document.getElementById("corazon");
    const ventana = document.getElementById("ventana");
    const puntos = ["p1", "p2", "p3"].map(id => document.getElementById(id));
    let toques = 0;
    let reinicio;

    function pintarPuntos() {
      puntos.forEach((p, i) => p.classList.toggle("lleno", i < toques));
    }

    corazon.addEventListener("click", () => {
      toques++;
      pintarPuntos();

      corazon.classList.add("toque");
      setTimeout(() => corazon.classList.remove("toque"), 150);

      // Si pasan 2 segundos sin tocar, vuelve a empezar
      clearTimeout(reinicio);
      reinicio = setTimeout(() => { toques = 0; pintarPuntos(); }, 2000);

      if (toques >= 3) {
        clearTimeout(reinicio);
        ventana.classList.add("visible");
        toques = 0;
        setTimeout(pintarPuntos, 400);
      }
    });

    ventana.addEventListener("click", () => ventana.classList.remove("visible"));
  </script>
</body>
</html>
